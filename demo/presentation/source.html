<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo source viewer</title>
  <style>
    body { margin: 0; background: white; color: #222; font: 16px/1.55 system-ui, sans-serif; }
    header { position: sticky; top: 0; padding: 18px 28px; background: white; border-bottom: 1px solid #ddd; z-index: 1; }
    a { color: #2a76dd; }
    h1 { display: inline; font: 19px ui-monospace, monospace; overflow-wrap: anywhere; margin-right: 24px; }
    nav { display: flex; gap: 24px; margin-top: 12px; }
    pre { margin: 24px 0; font: 16px/1.7 ui-monospace, "DejaVu Sans Mono", monospace; }
    .line { display: block; padding: 0 28px; white-space: pre-wrap; overflow-wrap: anywhere; scroll-margin-top: 120px; }
    .number { display: inline-block; width: 4em; color: #666; text-decoration: none; user-select: none; }
    .line:target { background: #e5f1ff; outline: 1px solid #2a76dd; }
    #error { color: #a00; padding: 24px; }
  </style>
</head>
<body>
  <header>
    <h1 id="name">Source</h1>
    <nav><a href="index.html">Slide deck</a><a id="raw" hidden target="_blank" rel="noopener">Raw file</a></nav>
  </header>
  <p id="error" role="alert" hidden></p>
  <pre><code id="content"></code></pre>
  <script src="source.js"></script>
</body>
</html>
